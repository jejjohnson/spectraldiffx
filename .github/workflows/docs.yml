name: Docs Build

# Builds the site with --strict on every PR, so broken references, bad
# docstrings or missing pages fail before merge. pages.yml deploys on main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  docs-build:
    name: Docs Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # mkdocs-git-authors-plugin reads the history

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build docs
        run: uv run mkdocs build --strict
