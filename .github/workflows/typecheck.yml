name: Type Check

on:
  push:
    branches: [main, master]
  # Any base branch, so stacked PRs are checked too.
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ty check
        run: uv run ty check spectraldiffx
