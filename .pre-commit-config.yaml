repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses !!python/name tags
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: forbid-ipynb
        name: Forbid .ipynb files (use jupytext .py instead)
        entry: "bash -c 'echo ERROR: .ipynb files are not allowed. Use jupytext .py files instead. && exit 1'"
        language: system
        files: '\.ipynb$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  - repo: local
    hooks:
      - id: ty
        name: ty check (matches the Type Check workflow)
        entry: uv run ty check spectraldiffx
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.5
    hooks:
      - id: jupytext
        args: [--sync]
